<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101516">
    <title>BibManu | Pizzeria Bella Manu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            color: #fffaf0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(185, 111, 54, 0.32), transparent 38%),
                radial-gradient(ellipse at 88% 78%, rgba(68, 117, 105, 0.24), transparent 36%),
                linear-gradient(135deg, #101516, #202826 55%, #131918);
        }

        .page {
            width: min(1120px, 100%);
            margin: 0 auto;
        }

        .intro {
            margin-bottom: 36px;
        }

        .brand {
            margin: 0 0 12px;
            color: #e7b878;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 400;
            letter-spacing: -0.06em;
            line-height: 1;
        }

        .subtitle {
            margin: 14px 0 0;
            color: rgba(255, 250, 240, 0.68);
            font-size: 1rem;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .product-panel {
            display: grid;
            min-height: 210px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.045));
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18), inset 0 1px rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .product-panel--image {
            position: relative;
            overflow: hidden;
        }

        .product-panel--image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-mark {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: rgba(255, 250, 240, 0.8);
            font-size: 1.5rem;
            font-weight: 300;
        }

        @media (max-width: 760px) {
            body {
                padding: 32px 18px;
            }

            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .product-panel {
                min-height: 180px;
            }
        }

        @media (max-width: 480px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="brand">Pizzeria Bella Manu</p>
            <h1>BibManu</h1>
            <p class="subtitle">Le nostre bibite</p>
        </header>

        <section class="products" aria-label="Spazi per i prodotti">
            <article class="product-panel" aria-label="Spazio per un prodotto">
                <span class="add-mark" aria-hidden="true"></span>
            </article>
            <article class="product-panel" aria-label="Spazio per un prodotto">
                <span class="add-mark" aria-hidden="true">+</span>
            </article>
            <article class="product-panel" aria-label="Spazio per un prodotto">
                <span class="add-mark" aria-hidden="true">+</span>
            </article>
            <article class="product-panel" aria-label="Spazio per un prodotto">
                <span class="add-mark" aria-hidden="true">+</span>
            </article>
            <article class="product-panel" aria-label="Spazio per un prodotto">
                <span class="add-mark" aria-hidden="true">+</span>
            </article>
            <article class="product-panel product-panel--image" aria-label="Coca-Cola">
                <img src="cocacola.jpg" alt="Bottiglia di Coca-Cola">
            </article>
        </section>
    </main>
</body>
</html>
